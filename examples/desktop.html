<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Emerald OS</title>
<style>
  /* :root token 表与 lib/emerald/theme.rb 的 dark 调色板 + comfortable 密度
     一一对应（Theme.apply 在运行期会重写这些变量做主题切换） */
  :root { --bg: #0b0e14; --panel: #11151f; --panel2: #151b28; --line: #232b3b;
          --fg: #c9d4e6; --dim: #7d8aa5; --accent: #4f8cff;
          --wallpaper: radial-gradient(ellipse at 30% 20%, #16233d, #0b0e14);
          --pad: 10px; --radius: 10px; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 -apple-system, "PingFang SC", sans-serif; height: 100vh; overflow: hidden; }
  #app { height: 100vh; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  p { margin: 0; }

  /* ── 滚动条：暗色主题细滚动条（WebKit/Blink 走伪元素，Firefox 走 scrollbar-*）── */
  * { scrollbar-width: thin; scrollbar-color: #2a3348 transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a3348; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a4660; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* 几何回写以 offsetWidth/Height 为准（含边框），面板必须 border-box，否则
     每次拖拽/点击回写都会让窗口「呼吸」变大（1px 边框 × 2） */
  *, *::before, *::after { box-sizing: border-box; }

  /* ── WindowFrame（沿用旧类名 + 状态类）────────────────── */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; overflow: hidden; box-shadow: 0 10px 30px #0006; }
  .panel.is-active { border-color: #35507e; }
  .panel.is-inactive .panel-head { opacity: .55; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel2); border-bottom: 1px solid var(--line); cursor: grab; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .wclass { color: var(--dim); font-size: 11px; }
  .panel-body { flex: 1; overflow: auto; padding: 8px; }

  /* ── 便利贴（异形窗口演示）────────────────────────────
     shape 由 WindowFrame 内联（clip-path 折角 + 包裹层 drop-shadow）；
     这里管"皮"：黄纸、胶带式标题栏、折角三角、微倾斜 */
  .panel-wrap.sticky-note-win { transform: rotate(-1.2deg); }
  .sticky-note-win .panel { background: #fef08a; border: none; border-radius: 3px; box-shadow: none; }
  .sticky-note-win .panel.is-active { border: none; }
  .sticky-note-win .panel-head { background: rgba(255, 255, 255, .45); border-bottom: none; padding: 4px 8px; }
  .sticky-note-win .panel-body { padding: 6px 10px 2px; overflow: hidden; }
  /* 折角：包裹层（不被 clip-path 裁剪）上的三角，斜边对整齐裁切口 */
  .panel-wrap.sticky-note-win::after { content: ''; position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; background: #d4a017; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .sticky-note { flex: 1; }
  .sticky-note-area { flex: 1; width: 100%; background: transparent; border: none; outline: none; resize: none; font: 14px/1.6 sans-serif; color: #3f3f46; }
  .sticky-note-status { font-size: 11px; color: #92700a; padding: 0 4px 4px; }

  /* 八向缩放手柄 */
  .rs-handle { position: absolute; z-index: 10; }
  .rs-n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: n-resize; }
  .rs-s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: s-resize; }
  .rs-e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: e-resize; }
  .rs-w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: w-resize; }
  .rs-ne { top: -3px; right: -3px; width: 12px; height: 12px; cursor: ne-resize; }
  .rs-nw { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nw-resize; }
  .rs-se { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: se-resize; }
  .rs-sw { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: sw-resize; }

  /* 窗口 chrome 控制钮 */
  .b-win-controls { display: flex; gap: 4px; margin-left: 8px; }
  .b-win-btn { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 5px; color: var(--dim); font-size: 11px; cursor: pointer; }
  .b-win-btn:hover { background: #ffffff14; color: var(--fg); }

  /* ── 菜单 ─────────────────────────────────────────────── */
  .menu-overlay { position: fixed; inset: 0; z-index: 2900; }
  .ctx-menu { position: fixed; z-index: 3000; min-width: 170px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; outline: none; }
  .menu-item { padding: 5px 12px; border-radius: 5px; cursor: pointer; position: relative; }
  .menu-item:hover, .menu-item.is-active { background: #4f8cff26; }
  .menu-item.is-disabled { color: #55607a; cursor: default; }
  .menu-item.is-disabled:hover { background: none; }
  .menu-sep { height: 1px; background: var(--line); margin: 4px 6px; }
  .b-menu-shortcut { margin-left: auto; color: var(--dim); font-size: 11px; }
  .has-submenu > .ctx-menu, .has-submenu > .b-submenu { position: absolute; left: 100%; top: -4px; }
  .has-submenu > .b-submenu { min-width: 170px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; z-index: 10; }
  .b-menubar { position: fixed; top: 0; left: 0; right: 0; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 2000; }
  .b-menubar-item.is-open { background: #4f8cff26; }

  /* ── 浮层 / 对话框 ────────────────────────────────────── */
  .b-popover { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .b-dialog-overlay { position: fixed; inset: 0; background: #0009; z-index: 3100; display: flex; align-items: center; justify-content: center; }
  .b-dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 20px 60px #000a; }
  .b-dialog-title { font-weight: 600; }
  .b-dialog-x { margin-left: auto; color: var(--dim); cursor: pointer; padding: 0 4px; }
  .b-dialog-x:hover { color: var(--fg); }
  .b-dialog-head { align-items: center; }
  .b-dialog-foot { justify-content: flex-end; }
  .b-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── 表单 ─────────────────────────────────────────────── */
  .b-select { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; min-width: 96px; text-align: left; }
  .b-select.is-open { border-color: var(--accent); }
  .b-radio, .b-switch { cursor: pointer; align-items: center; }
  .b-radio-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); }
  .b-radio.is-checked .b-radio-dot { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--accent); }
  .b-switch { width: 34px; height: 18px; border-radius: 9px; background: #2a3348; position: relative; }
  .b-switch.is-on { background: var(--accent); }
  .b-switch-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .b-switch.is-on .b-switch-thumb { left: 18px; }
  .b-slider { align-items: center; }
  .b-slider-btn { width: 24px; padding: 2px 0; }
  .b-slider-track { flex: 1; height: 4px; border-radius: 2px; background: #2a3348; position: relative; }
  .b-slider-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); }
  .b-slider-thumb { position: absolute; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: #fff; margin-left: -6px; }
  .b-number { align-items: center; }
  .b-number-btn { width: 24px; padding: 2px 0; }
  .b-number-input { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 4px 8px; }
  .b-search { align-items: center; }
  .b-search-input { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 4px 8px; }
  .b-search-clear { cursor: pointer; color: var(--dim); padding: 0 4px; }
  .b-combobox { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 4px 8px; width: 100%; }
  .b-combobox-list { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
  .b-color-grid { flex-wrap: wrap; }
  .b-color-swatch { width: 22px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .b-color-swatch.is-active { border-color: #fff; }
  .b-datepicker { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .b-dp-head { align-items: center; justify-content: space-between; }
  .b-dp-nav { width: 26px; padding: 2px 0; }
  .b-dp-grid { display: grid; grid-template-columns: repeat(7, 30px); gap: 2px; }
  .b-dp-wday, .b-dp-day, .b-dp-blank { height: 26px; display: flex; align-items: center; justify-content: center; }
  .b-dp-wday { color: var(--dim); font-size: 11px; }
  .b-dp-day { border-radius: 6px; cursor: pointer; }
  .b-dp-day:hover { background: #ffffff14; }
  .b-dp-day.is-active { background: var(--accent); color: #fff; }

  /* ── Tabs / Accordion ─────────────────────────────────── */
  .b-tab { border-radius: 6px 6px 0 0; border-bottom: none; }
  .b-tab.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .b-tab-body { border: 1px solid var(--line); border-radius: 0 8px 8px 8px; background: var(--panel2); }
  .b-acc-head { padding: 6px 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; align-items: center; gap: 6px; }
  .b-acc-body { padding: 8px 10px; }

  /* ── 展示 ─────────────────────────────────────────────── */
  .b-table { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .b-table-head { background: var(--panel2); }
  .b-table-th, .b-table-td { padding: 5px 10px; flex: 1; }
  .b-table-th { color: var(--dim); font-size: 11px; }
  .b-table-row { cursor: pointer; border-top: 1px solid var(--line); }
  .b-table-row.is-even { background: #ffffff06; }
  .b-table-row:hover { background: #4f8cff1a; }
  .b-table-row.is-selected { background: #4f8cff33; }
  .b-list { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .b-list-row { padding: 0 10px; align-items: center; cursor: pointer; }
  .b-list-row:hover { background: #4f8cff1a; }
  .b-list-row.is-selected { background: #4f8cff33; }
  .b-tree-row { align-items: center; gap: 4px; padding: 3px 4px; border-radius: 5px; cursor: pointer; }
  .b-tree-row:hover { background: #4f8cff1a; }
  .b-tree-row.is-selected { background: #4f8cff33; }
  .b-tree-caret { width: 14px; text-align: center; color: var(--dim); }
  .b-tree-leaf-dot::before { content: '·'; }
  .b-kv-key { color: var(--dim); }
  .b-crumb-sep { color: var(--dim); }
  .b-crumb.is-link { color: var(--accent); cursor: pointer; }
  .b-pagination { align-items: center; }
  .b-page-btn { min-width: 26px; padding: 2px 6px; }
  .b-page-btn.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .b-page-ellipsis { color: var(--dim); align-self: center; }
  .b-toolbar { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .b-statusbar { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--dim); }

  /* ── 反馈 ─────────────────────────────────────────────── */
  .b-toast { position: fixed; right: 16px; bottom: 56px; background: #161b28; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 14px; z-index: 4200; cursor: pointer; }
  .b-toast.error { border-left-color: #f85149; }
  .b-toast.success { border-left-color: #3fb950; }
  .b-toast-action { margin-left: 8px; padding: 1px 8px; font-size: 12px; }
  .b-progress { background: #2a3348; border-radius: 3px; overflow: hidden; }
  .b-progress-fill { height: 100%; background: var(--accent); transition: width .2s; }
  .b-progress.is-indeterminate .b-progress-fill { width: 40% !important; animation: b-indet 1.2s infinite linear; }
  @keyframes b-indet { from { margin-left: -40%; } to { margin-left: 100%; } }
  .b-spinner { border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: b-spin .8s infinite linear; }
  @keyframes b-spin { to { transform: rotate(360deg); } }
  .b-spinner-row { align-items: center; color: var(--dim); }
  .b-badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; background: #ffffff14; }
  .b-badge-info { background: #4f8cff33; color: #9ec1ff; }
  .b-badge-success { background: #3fb95033; color: #7ee2a0; }
  .b-badge-warn { background: #d2992233; color: #e8c580; }
  .b-badge-error { background: #f8514933; color: #ff9d97; }
  .b-empty { align-items: center; color: var(--dim); padding: 12px; }
  .b-empty-icon { font-size: 24px; }

  /* ── 任务栏 / tooltip ─────────────────────────────────── */
  .b-taskbar { background: var(--panel); border-top: 1px solid var(--line); align-items: center; padding: 0 8px; }
  .b-taskbtn.is-active { border-color: var(--accent); color: #fff; }
  .b-taskbtn.is-minimized { opacity: .55; }
  /* ── Notification（系统通知：标题+正文+✕，右上堆叠）──────── */
  .b-notification { position: fixed; right: 16px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 12px; z-index: 4300; min-width: 220px; }
  .b-notification.error { border-left-color: #f85149; }
  .b-notification.success { border-left-color: #3fb950; }
  .b-notification.warn, .b-notification.warning { border-left-color: #d29922; }
  .b-notification-head { align-items: center; font-weight: 600; }
  .b-notification-msg { color: var(--dim); margin-top: 2px; }
  .b-notification-x { margin-left: auto; color: var(--dim); cursor: pointer; padding: 0 4px; font-weight: 400; }
  .b-notification-x:hover { color: var(--fg); }
  .b-notification-action { margin-top: 6px; padding: 1px 8px; font-size: 12px; }
  /* DevTools：Tabs 正文占满剩余空间并自滚动（tab 栏保持常驻） */
  .devtools-tabs .b-tabs { flex: 1; min-height: 0; }
  .devtools-tabs .b-tab-body { flex: 1; min-height: 0; overflow: auto; }
  .b-tip { position: fixed; z-index: 5000; background: #000c; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 5px; pointer-events: none; }

  /* ── 桌面专属 ─────────────────────────────────────────── */
  /* 壁纸层：shell 内联样式铺满（position:fixed / inset:0 / var(--wallpaper) / z:0），
     此处留同名类兜底 */
  .desktop-wallpaper { position: fixed; inset: 0; z-index: 0; background: var(--wallpaper); }

  /* 桌面图标网格：v1 固定网格自动布局（列优先，从上往下、从左往右排），拖拽换位不做 */
  .icon-grid { position: fixed; top: 40px; left: 16px; bottom: 48px; z-index: 1;
               display: flex; flex-direction: column; flex-wrap: wrap; gap: 14px;
               align-content: flex-start; }
  .d-icon { display: flex; flex-direction: column; align-items: center; gap: 5px;
            width: 80px; padding: 8px 4px; border-radius: var(--radius);
            cursor: default; user-select: none; }
  .d-icon:hover { background: #ffffff14; }
  .d-icon.is-selected { background: #4f8cff33; outline: 1px solid var(--accent); }
  .d-icon-glyph { font-size: 28px; line-height: 1.15; }
  .d-icon-name { font-size: 11px; text-align: center; word-break: break-all; }

  /* 托盘：右侧固定条（叠在任务栏右端之上）：时钟 + 通知角标 */
  .tray { position: fixed; right: 8px; bottom: 0; height: 40px; z-index: 4001;
          display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .tray-clock { color: var(--dim); font-variant-numeric: tabular-nums; }
  .tray-badge { min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
                background: var(--accent); color: #fff; font-size: 11px;
                display: flex; align-items: center; justify-content: center; }

  /* 关于应用 */
  .about-title { font-size: 20px; font-weight: 700; }
  .about-version { color: var(--dim); font-variant-numeric: tabular-nums; }
  .about-kernel { color: var(--dim); line-height: 1.6; }

  /* 设置 · 应用管理 */
  .settings-hint { color: var(--dim); font-size: 12px; }
  .installed-app-row { display: flex; align-items: center; gap: 8px;
                       padding: 4px 6px; border-radius: var(--radius); }
  .installed-app-row:hover { background: #ffffff0d; }
</style>
</head>
<body>
<div id="app"></div>
<script src="desktop.js"></script>
</body>
</html>
